# Smithery configuration for LegalOne
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_legalone

name: legalone-mcp
displayName: "LegalOne"
description: >
  Wrapper da API oficial do LegalOne (Thomson Reuters / Novajus, pacote Premium): processos e litígios, contatos, agenda de compromissos e tarefas, andamentos, documentos, áreas, tipos de serviço e campos personalizados. Leitura, criação e edição, com filtros no padrão OData. Autenticação OAuth2 (client_credentials) provisionada pela Thomson Reuters por escritório. Cada coleção depende do escopo contratado com a TR, e tools genéricas cobrem qualquer endpoint fora da lista.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/legalone-mcp
repository: https://github.com/mcp-dir/legalone-mcp

tags:
  - legalone
  - brazil
  - med
  - vertical
  - read-write

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_legalone

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_legalone/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
